<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos Pessoais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <header>
            <h1>Gatos <span class="tiny-grey">(gastos)</span> Pessoais 😼💲</h1>
        </header>
        <main>
            <!-- FORMULÁRIO -->
            <div>
                <fieldset>
                    <legend>Adicionar gastos</legend>

                    <form id="formGasto">
                        
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao">

                        <br><br>

                        <label for="categoria">Categoria</label>
                        <select id="categoria">
                            <option value="Alimentacao">Alimentação</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Outro">Outro</option>
                        </select>

                        <br><br>

                        <label for="valor">Valor</label>
                        <input type="number" id="valor" step="0.01">

                        <br><br>

                        <button type="submit">Anotar!</button>
                    </form>
                </fieldset>
            </div>
            <!-- FILTRO -->
            <div>
                <fieldset>
                    <legend>Filtrar</legend>

                    <label for="filtroCategoria">Categoria</label>
                    <select id="filtroCategoria">
                        <option value="Todos">Todos</option>
                        <option value="Alimentacao">Alimentação</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Outro">Outro</option>
                    </select>
                    <label for="ordemMostragem">Ordenar por</label>
                    <select id="ordenarPor">
                        <option value="maisAntigo">Mais antigo</option>
                        <option value="maisRecente">Mais recente</option>
                        <option value="maiorMenor">Maior para menor</option>
                        <option value="menorMaior">Menor para maior</option>
                    </select>
                </fieldset>
            </div>
            <!-- LISTA DE GASTOS -->
            <div>
                <fieldset>
                    <legend>Gastos</legend>
                    <div id="listaGastos">
                    </div>
                </fieldset>
            </div>
            <!-- TOTAL -->
            <div>
                <fieldset>
                    <legend>Total</legend>
                    <p>Total: <span id="total" class="valor-gasto">0.00</span>
                    <br>
                    <span class="smaller-grey">Total da categoria: <span id="total-categoria">0.00</span></span></p>
                </fieldset>
            </div>
        </main>
        <footer>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
