<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos Pessoais</title>
</head>
<body>
    <div>
        <header>
            <h1>Gatos Pessoais</h1>
        </header>
        <main>
            <div>
                <fieldset>
                    <legend>Adicionar gasto</legend>
                    <form action="">
                        <legend>Nome do gasto</legend> <input type="text" id="nomeGast">
                        <legend>Categoria</legend>
                        <select name="categoria" id="categoriaGast">
                            <option value="Comida">Comida</option>
                            <option value="Passeio">Passeio</option>
                            <option value="Outro">Outro</option>
                        </select>
                        <legend>Valor</legend> <input type="number" name="valor" id="valorGast">
                        <br><button type="submit">Anotar!</button>
                    </form>
                </fieldset>
            </div>
            <div>
                <div>
                    <fieldset>
                        <legend>Filtrar</legend>
                        <form action="">
                            <legend>Categoria</legend>
                            <select name="" id="">
                                <option value="Comida">Comida</option>
                                <option value="Passeio">Passeio</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </form>
                    </fieldset>
                </div>
                <div>
                    <fieldset>
                        <legend>Gastos</legend>
                    </fieldset>
                </div>
                <div>
                    <fieldset>
                        <legend>Total</legend>
                        <p>O valor total se dá...</p>
                    </fieldset>
                </div>
            </div>
        </main>
        <footer>

        </footer>
    </div>
</body>
</html>
